<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="600" height="400" fill="#0f172a" rx="12"/>
  <text x="300" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">内核调度流程</text>
  <rect x="40" y="60" width="140" height="44" rx="8" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="110" y="87" text-anchor="middle" fill="#06b6d4" font-size="13" font-weight="600">高优先级线程</text>
  <rect x="230" y="60" width="140" height="44" rx="8" fill="#1e3a5f" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="300" y="87" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="600">中优先级线程</text>
  <rect x="420" y="60" width="140" height="44" rx="8" fill="#1e3a5f" stroke="#10b981" stroke-width="1.5"/>
  <text x="490" y="87" text-anchor="middle" fill="#10b981" font-size="13" font-weight="600">低优先级线程</text>
  <text x="300" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">▼ 调度器选择最高优先级就绪线程 ▼</text>
  <rect x="150" y="158" width="300" height="52" rx="10" fill="#1e3a5f" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="190" text-anchor="middle" fill="#f59e0b" font-size="15" font-weight="700">调度器 (Scheduler)</text>
  <line x1="110" y1="104" x2="200" y2="158" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="300" y1="104" x2="300" y2="158" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="490" y1="104" x2="400" y2="158" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="300" y="248" text-anchor="middle" fill="#94a3b8" font-size="13">触发调度的时机</text>
  <rect x="40" y="262" width="120" height="36" rx="6" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1"/>
  <text x="100" y="285" text-anchor="middle" fill="#06b6d4" font-size="11">k_yield()</text>
  <rect x="175" y="262" width="120" height="36" rx="6" fill="#1e3a5f" stroke="#8b5cf6" stroke-width="1"/>
  <text x="235" y="285" text-anchor="middle" fill="#8b5cf6" font-size="11">k_sleep()</text>
  <rect x="310" y="262" width="120" height="36" rx="6" fill="#1e3a5f" stroke="#10b981" stroke-width="1"/>
  <text x="370" y="285" text-anchor="middle" fill="#10b981" font-size="11">ISR 中断</text>
  <rect x="445" y="262" width="120" height="36" rx="6" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1"/>
  <text x="505" y="285" text-anchor="middle" fill="#f59e0b" font-size="11">k_sem_give()</text>
  <text x="300" y="336" text-anchor="middle" fill="#64748b" font-size="12">协作式线程：主动让出 CPU | 抢占式线程：可被高优先级打断</text>
  <text x="300" y="360" text-anchor="middle" fill="#64748b" font-size="12">时间片轮转：同优先级抢占式线程轮流执行 (CONFIG_TIMESLICING)</text>
  <rect x="40" y="375" width="520" height="4" rx="2" fill="#1e3a5f"/>
  <rect x="40" y="375" width="520" height="4" rx="2" fill="#06b6d4" opacity="0.3"/>
</svg>
